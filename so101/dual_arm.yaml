robot: so101_dual
joints:
- shoulder_pan
- shoulder_lift
- elbow_flex
- wrist_flex
- wrist_roll
- gripper
arms:
  left:
    leader:
      port_by_id: usb-1a86_USB_Single_Serial_5B14031917-if00
      calibration_file: so101/calibration/left_leader.json
    follower:
      port_by_id: usb-1a86_USB_Single_Serial_5B14033136-if00
      calibration_file: so101/calibration/left_follower.json
  right:
    leader:
      port_by_id: usb-1a86_USB_Single_Serial_5B14112595-if00
      calibration_file: so101/calibration/right_leader.json
    follower:
      port_by_id: usb-1a86_USB_Single_Serial_5B14110654-if00
      calibration_file: so101/calibration/right_follower.json
cameras:
  # device: stable /dev/v4l/by-id/... or /dev/v4l/by-path/... link (or an int index). Fill in on the target host.
  # Names must stay cam_high / cam_left_wrist / cam_right_wrist (the openpi data config reads these).
  cam_high:        {device: /dev/v4l/by-id/FILL_ME, fps: 30, width: 640, height: 480}
  cam_left_wrist:  {device: /dev/v4l/by-id/FILL_ME, fps: 30, width: 640, height: 480}
  cam_right_wrist: {device: /dev/v4l/by-id/FILL_ME, fps: 30, width: 640, height: 480}
