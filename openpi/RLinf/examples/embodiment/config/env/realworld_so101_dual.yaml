env_type: realworld

total_num_envs: null
auto_reset: True
ignore_terminations: False
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
# 30 Hz (the SO101 recording rate): 3600 steps = two minutes per episode.
max_steps_per_rollout_epoch: 3600
max_episode_steps: 3600
main_image_key: cam_high

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "So101DualEnv-v1"
  num_envs: null
