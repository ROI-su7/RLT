env_type: realworld

total_num_envs: null
auto_reset: True
ignore_terminations: False
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
# Four wire slots require a longer continuous rollout. At 15 Hz, 4000 steps
# provide roughly 267 seconds before truncation.
max_steps_per_rollout_epoch: 4000
max_episode_steps: 4000
main_image_key: cam_high

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "PiperWireEnv-v1"
  num_envs: null
