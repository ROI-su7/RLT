# Evo-RL "SFT + interventions" baseline: plain LoRA flow-matching SFT on the
# demonstrations plus human segments of successful takeover episodes. Same
# model, LoRA selection, optimizer and checkpoint format as piper_recap_cfg
# (kept in sync by tests/unit_tests/test_piper_recap.py); no advantages and
# no CFG prompt: every frame uses the original task prompt.
defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:RECAP_RUN_DIR}
    project_name: piper-recap
    experiment_name: piper_recap_sft_int
    logger_backends: [tensorboard]
  max_epochs: 2000
  max_steps: 2000
  val_check_interval: -1
  save_interval: 100
  resume_dir: null

data:
  num_workers: 0
  plain_sft: true
  advantage_tag: null
  balance_dataset_weights: true
  seed: 42
  train_data_paths:
    - dataset_path: ${oc.env:RECAP_SFT_DATASET}
      type: sft
      weight: 1.0
    - dataset_path: ${oc.env:RECAP_INT_DATASET}
      type: sft
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42
  model:
    model_type: cfg_model
    precision: bf16
    model_path: ${oc.env:RECAP_PI05_TORCH_DIR}
    is_lora: false
    recap_lora_only: true
    # Recorded in piper_recap_policy.json; serving picks the matching config.
    piper_policy_mode: sft_int
    add_value_head: false
    openpi:
      config_name: pi05_piper_joint
      action_horizon: 50
      action_dim: 32
      action_env_dim: 14
      action_chunk: 10
      num_images_in_input: 3
      num_steps: 10
      train_expert_only: true
      cfgrl_guidance_scale: 1.0
      unconditional_prob: 1.0
      positive_only_conditional: true
      guidance_type: no_guide
    openpi_data:
      norm_stats_path: ${oc.env:RECAP_NORM_STATS}
      default_prompt: ${oc.env:RECAP_TASK}
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 100
    total_training_steps: 2000
    min_lr: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
